# ============================================================
# ALhafez Center - Docker Compose (Production)
# ============================================================
# الاستخدام:
#   docker compose up -d --build
#   docker compose down
#   docker compose logs -f backend
# ============================================================

services:

  # ==================== PostgreSQL Database ====================
  db:
    image: postgres:16-alpine
    container_name: hafaz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hafaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hafaz_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-alhafaz_center}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hafaz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hafaz_user} -d ${POSTGRES_DB:-alhafaz_center}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Backend (FastAPI + AI) ====================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hafaz-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hafaz_user:hafaz_secure_password_2024@db:5432/alhafaz_center}
      SECRET_KEY: ${SECRET_KEY:-hafaze-store-super-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-eyad_moh14}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-1234567##a}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_EMBEDDING_MODEL: ${GOOGLE_EMBEDDING_MODEL:-models/text-embedding-004}
      CHROMA_ANONYMIZED_TELEMETRY: ${CHROMA_ANONYMIZED_TELEMETRY:-False}
      APP_NAME: ${APP_NAME:-صالة الحافظ للقطع الكهربائية}
      DEBUG: ${DEBUG:-False}
    volumes:
      - backend_uploads:/app/backend/uploads
      - ai_chroma_data:/app/ai/chroma_db_v2
      - ai_knowledge_base:/app/ai/knowledge_base
      - backend_logs:/app/backend/logs
    ports:
      - "8001:8001"
    networks:
      - hafaz-network
    depends_on:
      db:
        condition: service_healthy

  # ==================== Frontend (Next.js) ====================
  frontend:
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-صالة الحافظ للقطع الكهربائية}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: hafaz-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - hafaz-network
    depends_on:
      - backend

  # ==================== Nginx Reverse Proxy ====================
  nginx:
    image: nginx:alpine
    container_name: hafaz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_uploads:/app/uploads:ro
    networks:
      - hafaz-network
    depends_on:
      - backend
      - frontend


# ==================== Volumes ====================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  ai_chroma_data:
    driver: local
  ai_knowledge_base:
    driver: local
  backend_logs:
    driver: local


# ==================== Networks ====================
networks:
  hafaz-network:
    driver: bridge
